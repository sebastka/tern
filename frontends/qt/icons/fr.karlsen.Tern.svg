<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Tern</title>
  <!-- A diving arctic tern whose swept-back wings form the flap of an
       envelope: it plunges head first into the letter, tail streamers
       sticking out over the top edge. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b9fe5"/>
      <stop offset="1" stop-color="#1a5aa3"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cbcf2"/>
      <stop offset="1" stop-color="#3f9ae0"/>
    </linearGradient>
    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb1c4"/>
      <stop offset="0.5" stop-color="#e2e9f0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="wingR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb1c4"/>
      <stop offset="0.5" stop-color="#e2e9f0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <!-- tail streamers: grey tips (top) to white at the body -->
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#97aabf"/>
      <stop offset="0.6" stop-color="#dfe7ef"/>
      <stop offset="1" stop-color="#f6f9fb"/>
    </linearGradient>
    <clipPath id="env">
      <rect x="20" y="62" width="216" height="150" rx="18"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0b2f5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- everything, centred vertically (tail tips to envelope bottom) -->
  <g transform="translate(0 16)">
  <!-- envelope -->
  <g filter="url(#shadow)">
    <rect x="20" y="62" width="216" height="150" rx="18" fill="url(#body)"/>
    <!-- lower folds, faint -->
    <g clip-path="url(#env)" fill="none" stroke="#174f90" stroke-opacity="0.45" stroke-width="5"
       stroke-linecap="round">
      <path d="M22 210 L104 150"/>
      <path d="M234 210 L152 150"/>
    </g>
    <!-- the flap -->
    <path clip-path="url(#env)" d="M20 62 L236 62 L128 142 Z" fill="url(#flap)"/>
  </g>

  <!-- tern -->
  <g filter="url(#shadow)">
    <!-- forked tail, out over the top edge -->
    <path d="M124 76 C120 58 112 38 98 12 C114 32 124 50 132 70 Z" fill="url(#tail)"/>
    <path d="M132 76 C136 58 144 38 158 12 C142 32 132 50 124 70 Z" fill="url(#tail)"/>
    <!-- wings, swept back along the flap edges -->
    <path d="M126 136 C100 120 60 92 18 60 C62 82 100 100 130 112 Z" fill="url(#wingL)"/>
    <path d="M130 136 C156 120 196 92 238 60 C194 82 156 100 126 112 Z" fill="url(#wingR)"/>
    <!-- body, head down -->
    <path d="M128 66 C138 82 140 118 137 140 C135 150 121 150 119 140 C116 118 118 82 128 66 Z"
          fill="#ffffff"/>
    <!-- black cap -->
    <path d="M118 140 C118 131 138 131 138 140 C138 149 132 153 128 153 C124 153 118 149 118 140 Z"
          fill="#11161c"/>
    <!-- red bill, diving into the letter -->
    <path d="M122 150 L134 150 L128 182 Z" fill="#e23c1a"/>
  </g>
  </g>
</svg>
