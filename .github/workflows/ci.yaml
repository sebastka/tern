---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pinned by commit, so the toolchain is given explicitly (the action
      # would otherwise take it from the ref name).
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Start the test mail servers
        run: |
          docker compose -f testenv/compose.yaml up -d
          timeout 90 bash -c 'until (echo > /dev/tcp/127.0.0.1/31143) 2>/dev/null; do sleep 1; done'
          timeout 90 bash -c 'until (echo > /dev/tcp/127.0.0.1/1025) 2>/dev/null; do sleep 1; done'
      - name: Tests (unit, gpg, IMAP, SMTP, end-to-end)
        env:
          TERN_TEST_IMAP: 127.0.0.1:31143
          TERN_TEST_SMTP: 127.0.0.1:1025
          TERN_TEST_MAILPIT_API: 127.0.0.1:8025
        run: cargo test --workspace --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo check --workspace --locked

  qt:
    name: Qt frontend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest Qt we target, and the oldest supported (Qt 6.8).
          - {name: "Fedora 44",         image: "fedora:44"}
          - {name: "Debian 13, Qt 6.8", image: "debian:trixie"}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies (Fedora)
        if: startsWith(matrix.image, 'fedora')
        run: >
          dnf -y -q install git cmake ninja-build gcc-c++ cargo rust corrosion pkgconf-pkg-config
          qt6-qtbase-devel qt6-qtwebengine-devel libcanberra-devel
      - name: Install build dependencies (Debian)
        if: startsWith(matrix.image, 'debian')
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-webengine-dev libgl-dev libcanberra-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Rust (Debian's is older than the MSRV)
        if: startsWith(matrix.image, 'debian')
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: ". -> build/cargo"
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - run: cmake --build build

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
      - run: nix build -L .#tern
      - run: nix flake check

  deny:
    name: Advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
