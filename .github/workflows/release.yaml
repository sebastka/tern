---
name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build the
# packages for x86_64 and aarch64 and publish them as a GitHub release.
'on':
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          spec=$(sed -n 's/^Version: *//p' packaging/tern.spec)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$spec" != "$version" ]; then
            echo "::error::packaging/tern.spec has $spec, Cargo.toml has $version"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $version"; exit 1
          fi

  rpm:
    name: RPM (Fedora 44, ${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    steps:
      - run: dnf -y -q install git rpm-build dnf-plugins-core cargo tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: dnf -y -q builddep packaging/tern.spec
      - run: packaging/make-sources.sh
      - name: rpmbuild (runs the test suite in %check)
        run: |
          rpmbuild -ba packaging/tern.spec \
            --define "_sourcedir $PWD/packaging/out" \
            --define "_rpmdir $PWD/packaging/out/rpm" \
            --define "_srcrpmdir $PWD/packaging/out/rpm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rpm-${{ matrix.arch }}
          # Binary and source RPMs; debuginfo packages are left out. Both
          # arches build the same source RPM, the publish step keeps one.
          path: |
            packaging/out/rpm/*/tern-${{ needs.version.outputs.version }}-*.rpm
            packaging/out/rpm/*.src.rpm
          if-no-files-found: error

  deb:
    name: .deb (Debian 13, ${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: packaging/build-deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: packaging/out/*.deb
          if-no-files-found: error

  nix:
    name: Nix (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
      - run: nix build -L .#tern

  publish:
    name: Publish release
    needs: [version, rpm, deb, nix]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*.rpm' -o -name '*.deb' \) -exec mv {} . \;
          sha256sum -- *.rpm *.deb > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/*.rpm
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
