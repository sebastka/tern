[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastka/tern"
homepage = "https://github.com/sebastka/tern"

[workspace.dependencies]
tern-config = { path = "crates/tern-config" }
tern-core = { path = "crates/tern-core" }
tern-imap = { path = "crates/tern-imap" }
tern-smtp = { path = "crates/tern-smtp" }
tern-pgp = { path = "crates/tern-pgp" }
tern-app = { path = "crates/tern-app" }

ammonia = "4"
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cxx = "1"
cxx-build = "1"
futures = "0.3"
html2text = "0.17"
htmd = "0.5"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "pool"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zstd = "0.13"

[profile.release]
lto = "thin"
debug = "line-tables-only"
